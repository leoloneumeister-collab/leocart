name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kart racer (site root)
      - run: npm ci
      - run: npm run build
      # Shadow Protocol shooter (served under /shooter/)
      - run: npm ci
        working-directory: shooter
      - run: npm run build
        working-directory: shooter
      - run: mkdir -p dist/shooter && cp -r shooter/dist/. dist/shooter/
      # LANEFALL MOBA (served under /moba/)
      - run: npm ci
        working-directory: moba
      - run: npm run build
        working-directory: moba
      - run: mkdir -p dist/moba && cp -r moba/dist/. dist/moba/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
